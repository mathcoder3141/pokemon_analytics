version: 2

models:
  - name: bridge_pokemon_moves
    description: >
      Bridge between Pokémon and moves, preserving:
        - learning method
        - level requirement
        - game version group.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pokemon_id
              - move_id
              - version_group
              - learn_method
              - level_learned_at
    
    columns:
      - name: pokemon_id
        data_type: integer
        description: "{{ doc('pokemon_id') }}. This references the Pokemon that learns the move."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pokemon')
                field: pokemon_id

      - name: move_id
        data_type: integer
        description: "THe unique identifier for the Pokemon's move."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_moves')
                field: move_id

      - name: learn_method
        data_type: varchar
        description: "The method by which the move is learned."

      - name: level_learned_at
        data_type: integer
        description: "The minimum level to learn the move."

      - name: version_group
        data_type: varchar
        description: "The version group in which the move is learned."
        data_tests:
          - not_null

  - name: dim_pokemon_abilities
    description: "A dimensional model of all of the abilities a Pokemon can possibly have."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pokemon_id
              - ability_id

    columns:
      - name: pokemon_id
        data_type: integer
        description: "{{ doc('pokemon_id') }}. This references the Pokemon that has the designated ability."
        data_tests:
          - relationships:
              arguments:
                to: ref('incoming_pokemon')
                field: id

      - name: ability_id
        data_type: integer
        description: "Unique identifier for an Ability."

      - name: ability_name
        data_type: varchar
        description: "The name of the ability the Pokémon may have."

      - name: ability_url
        data_type: varchar
        description: "The URL for the API response for the Pokemon's ability."

      - name: is_hidden
        data_type: boolean
        description: "Whether or not this is a hidden ability."

      - name: slot
        data_type: integer
        description: "The slot the ability occupies in this Pokémon species."

  - name: dim_pokemon_species
    description: > 
      A model for the Pokemon species. This describes the Pokemon species more in depth.
      Graain is species so number of expected rows is the number of Pokemon in the Pokedex.

      The difference between the `dim_pokemon_species` model and `dim_pokemon` model is that `dim_pokemon` has multiple
      records per species to take into account multiple forms e.g., multiple forms of Burmy.
    columns:
      - name: species_id
        data_type: integer
        description: "The unique ID for a Pokemon species."
        data_tests:
          - unique
          - not_null

      - name: species_name
        data_type: varchar
        description: "The name of the Pokemon species."

      - name: base_happiness
        data_type: integer
        description: "The happiness when caught by a normal Pokéball; up to 255. The higher the number, the happier the Pokémon."

      - name: capture_rate
        data_type: integer
        description: "The base capture rate; up to 255. The higher the number, the easier the catch."

      - name: growth_rate_name
        data_type: varchar
        description: "The rate at which this Pokémon species gains levels."

      - name: habitat_name
        data_type: varchar
        description: "The habitat this Pokémon species can be encountered in."

      - name: generation_name
        data_type: varchar
        description: "The generation this Pokémon species was introduced in."

      - name: has_gender_differences
        data_type: boolean
        description: "Whether or not this Pokémon has visual gender differences."

      - name: hatch_counter
        data_type: integer
        description: >
          Initial hatch counter: one must walk Y × (hatch_counter + 1) steps before this Pokémon's egg hatches, 
          unless utilizing bonuses like Flame Body's. Y varies per generation. 
          
          In Generations II, III, and VII, Egg cycles are 256 steps long. 
          In Generation IV, Egg cycles are 255 steps long. 
          In Pokémon Brilliant Diamond and Shining Pearl, Egg cycles are also 255 steps long, but are shorter on special dates. 
          In Generations V and VI, Egg cycles are 257 steps long. 
          In Pokémon Sword and Shield, and in Pokémon Scarlet and Violet, Egg cycles are 128 steps long.

      - name: is_baby
        data_type: boolean
        description: "Whether or not this is a baby Pokémon."

      - name: is_mythical
        data_type: boolean
        description: "Whether or not this is a mythical Pokémon."

      - name: is_legendary
        data_type: boolean
        description: "Whether or not this is a legendary Pokémon."

      - name: num_forms
        data_type: bigint
        description: "The number of forms the species has."

  - name: dim_pokemon_stats
    description: "A model containing all the information of a Pokemon's stats. Grain is a Pokemon form."
    columns:
      - name: pokemon_id
        data_type: integer
        description: "{{ doc('pokemon_id') }}. This references the Pookemon that a stat applies to."
        data_tests:
          - unique
          - not_null

      - name: hp
        data_type: integer
        description: "The value for a Pokemon's HP (hit points) stat."
        data_tests:
          - not_null

      - name: attack
        data_type: integer
        description: "The value for a Pokemon's attack stat."
        data_tests:
          - not_null

      - name: special_attack
        data_type: integer
        description: "The value for a Pokemon's special attack stat."
        data_tests:
          - not_null

      - name: defense
        data_type: integer
        description: "The value for a Pokemon's defense stat."
        data_tests:
          - not_null

      - name: special_defense
        data_type: integer
        description: "The value for a Pokemon's special defense stat."
        data_tests:
          - not_null

      - name: speed
        data_type: integer
        description: "The value for a Pokemon's speed stat."
        data_tests:
          - not_null

      - name: base_stat_total
        data_type: hugeint
        description: "The sum of the values for all of the base stats (HP, Attack, Special Attacck, Defense, Special Defense, Speed)"
        data_tests:
          - not_null

  - name: dim_pokemon_types
    description: "A model containing information about a Pokemon's typings. If a Pokemon has multiple types, the types will be condensed into primary/secondary."
    columns:
      - name: pokemon_id
        data_type: integer
        description: "{{ doc('pokemon_id') }}. This references the Pookemon that a stat applies to."
        data_tests:
          - relationships:
              arguments:
                to: ref('incoming_pokemon')
                field: id
          - unique
          - not_null

      - name: primary_type_id
        data_type: integer
        description: "The unique identifier for a Pokemon's primary typing."
        data_tests:
          - not_null

      - name: secondary_type_id
        data_type: integer
        description: "The unique identifier for a Pokemon's secondary typing."

      - name: primary_type_name
        data_type: varchar
        description: "The name of the Pokemon's primary typing."
        data_tests:
          - not_null

      - name: secondary_type_name
        data_type: varchar
        description: "The name of the Pokemon's secondary typing."

  - name: dim_pokemon
    description: "A model that is designed to contain all the Pokemon details returned by the Pokemon API."
    columns:
      - name: pokemon_id
        data_type: integer
        description: "The unique identifier for the Pokemon."
        data_tests:
          - unique
          - not_null

      - name: name
        data_type: varchar
        description: "The name of the Pokemon."
        data_tests:
          - not_null

      - name: base_experience
        data_type: integer
        description: "The base experience gained for defeating this Pokémon."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: false

      - name: species_id
        data_type: integer
        description: "The identifier for the Pokemon species. Since there are multiple forms of a Pokemon species, this is not unique."
        relationships:
          - arguments:
            to: ref('incoming_pokemon_species')
            field: species_id

      - name: height
        data_type: integer
        description: "The height of this Pokémon in decimetres."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: false

      - name: weight
        data_type: integer
        description: "The weight of this pokemon in hectograms."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: false

  - name: dim_moves
    description: >
      A model that is designed to hold all of the moves of Pokemon that exist.
      Moves are the skills of Pokémon in battle. In battle, a Pokémon uses one move each turn.

      This model includes details about a singular move.
    
    columns:
      - name: move_id
        data_type: integer
        description: "The unique identifier for the Move."
        data_tests:
          - unique
          - not_null

      - name: move_name
        data_type: varchar
        description: "The name of the Move."

      - name: move_type
        data_type: varchar
        description: "The elemental type of this move."

      - name: move_accuracy
        data_type: integer
        description: "The percent value of how likely this move is to be successful."

      - name: move_power_points
        data_type: integer
        description: "Power points. The number of times this move can be used."

      - name: move_power
        data_type: integer
        description: "The base power of this move with a value of 0 if it does not have a base power."

      - name: damage_class_name
        data_type: varchar
        description: "The type of damage the move inflicts on the target, e.g. physical."

      - name: move_type_id
        data_type: integer
        description: "The identifier for the elemental type of this move."
        data_tests:
          - relationships:
              arguments:
                to: ref('incoming_types')
                field: id

  - name: dim_type_effectiveness
    description: "Describes the effectiveness of an attacking move type against a defending Pokémon type."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - attacking_type_id
              - defending_type_id

    columns:
      - name: pk_type_effectiveness
        data_type: varchar
        description: "A surrogate key comprised of the attacking type ID and the defending type ID."
        data_tests:
          - unique
          - not_null

      - name: attacking_type_id
        data_type: integer
        description: "The identifier of the attacking move type."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('incoming_types')
                field: id

      - name: attacking_type_name
        data_type: varchar
        description: "The name of the attacking move type."

      - name: multiplier
        data_type: double
        description: >
          The damage multiplier applied based on the attacking move's type and the defending Pokémon's type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 0.0
                  - 0.5
                  - 1.0
                  - 2.0

      - name: defending_type_name
        data_type: varchar
        description: "The name of the defending pokemon type."

      - name: defending_type_id
        data_type: integer
        description: "The identifier of the defending pokemon type."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('incoming_types')
                field: id